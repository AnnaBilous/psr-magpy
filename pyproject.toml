[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psr_magpy"
version = "0.1.0"
description = "Magnetic field line tracing package for pulsar magnetosphere modeling"
authors = [
    {name = "Anna Bilous", email = "hanna.bilous@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "astropy>=5.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
packages = ["psr_magpy"]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/psr_magpy" = ["README.md"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["psr_magpy"]


[project.scripts]
psr-magpy-setup = "psr_magpy.cli.setup_environment:main"
psr-magpy-setup-env = "psr_magpy.cli.setup_environment:main" 