[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psr_magpy"
version = "0.1.0"
description = "Magnetic field line tracing package for pulsar magnetosphere modeling"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Anna Bilous", email = "hanna.bilous@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.4,<2",
    "scipy>=1.9.3",
    "astropy>=6.0.1,<7",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numba>=0.54.1",
    "CyRK>=0.16.0",
    "healpy>=1.16.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
    "pydocstyle>=6.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "myst-parser>=0.18.0",
    "nbsphinx>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["psr_magpy*"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["psr_magpy"]


[project.scripts]
psr-magpy-setup = "psr_magpy.cli.setup_environment:main"
psr-magpy-setup-env = "psr_magpy.cli.setup_environment:main"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = false

# NumPy typing support
plugins = ["numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = [
    "CyRK.*",
    "scipy.*",
    "astropy.*",
]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "numpy"
add-ignore = ["D100", "D104"]
match = "(?!test_).*\\.py"