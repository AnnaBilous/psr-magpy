[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psr_magpy"
version = "0.1.0"
description = "Magnetic field line tracing package for pulsar magnetosphere modeling"
authors = [
    {name = "Anna Bilous", email = "hanna.bilous@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "astropy>=5.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
packages = ["psr_magpy"]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/psr_magpy" = ["README.md"]


[project.scripts]
psr-magpy-setup = "psr_magpy.cli.setup_environment:main"
psr-magpy-setup-env = "psr_magpy.cli.setup_environment:main" 